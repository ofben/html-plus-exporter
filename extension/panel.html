<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clip2Demo</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main class="layout">
      <section class="capture">
        <h1>Clip2Demo</h1>
        <p>Select an element in the Elements panel and configure export options.</p>
        <form id="captureForm">
          <fieldset>
            <legend>HTML Scope</legend>
            <label>
              <input type="radio" name="scope" value="selection" checked />
              Use current selection
            </label>
            <label>
              <input type="radio" name="scope" value="selector" />
              CSS selector:
              <input type="text" id="selectorInput" placeholder="#app .card" />
            </label>
          </fieldset>
          <fieldset>
            <legend>CSS Mode</legend>
            <label><input type="radio" name="cssMode" value="raw" checked /> Raw (author rules only)</label>
            <label><input type="radio" name="cssMode" value="minimal" /> Minimal (inline computed fallbacks)</label>
          </fieldset>
          <fieldset>
            <legend>Assets</legend>
            <label><input type="checkbox" name="inlineAssets" checked /> Inline assets (fonts/images)</label>
            <label><input type="checkbox" name="includeJS" /> Include JavaScript listeners</label>
          </fieldset>
          <fieldset>
            <legend>Output</legend>
            <label>
              <input type="radio" name="output" value="single" checked />
              Single HTML file download
            </label>
            <label>
              <input type="radio" name="output" value="codepen" />
              Send to CodePen
            </label>
          </fieldset>
          <button type="submit" id="captureButton">Capture subtree</button>
          <output id="status" role="status" aria-live="polite"></output>
        </form>
      </section>
      <section class="preview">
        <h2>Preview</h2>
        <textarea id="preview" readonly></textarea>
      </section>
    </main>
    <script src="panel.js" type="module"></script>
  </body>
</html>
